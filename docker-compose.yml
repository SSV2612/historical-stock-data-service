version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - trading-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - trading-network

  historical-stock-data-service:
    image: ssv2612/historical-stock-data-service:latest
    container_name: historical-stock-data-service
    build:
      context: .
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
      - redis
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
